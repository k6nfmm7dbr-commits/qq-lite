# ============================================================
#  QQ 瘦身 · 主配置片段
#  ----------------------------------------------------------
#  不想托管模块文件？把下面的 rules 直接粘进 Egern 主配置
#  （Profile.yaml）的 rules 列表里即可，效果完全一样。
#
#  ⚠️ 位置很重要：客户端从上到下匹配第一条命中的规则。
#     请把这段放在任何宽泛的直连规则之前，例如：
#
#         - domain_suffix: {match: "qq.com", policy: DIRECT}   ← 必须在下面这段之后
#
#     放错位置 = 完全失效。
#
#  验证：请求记录 → 打开 QQ → 看是否显示 REJECT。
# ============================================================

rules:

  # ── 腾讯广告体系：广点通 / 优量汇 ──
  - domain_suffix:
      match: "gdt.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "pgdt.gtimg.cn"
      policy: REJECT
  - domain_suffix:
      match: "pgdt.ugdtimg.com"
      policy: REJECT
  - domain_suffix:
      match: "e.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "l.qq.com"
      policy: REJECT

  # ── 腾讯自有广告投放 / 素材 / 监测 ──
  - domain_suffix:
      match: "ad.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adnet.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adping.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsclick.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsfile.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsgroup.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adshmct.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adshmmsg.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adslvfile.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adslvseed.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsqqclick.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsrich.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adstextview.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsview.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsview2.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "ads.privacy.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsmind.apdcdn.tc.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsmind.gdtimg.com.tcdn.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adsmind.ugdtimg.com.tcdn.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "ads-acc.qqbrowser.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "adfilter.imtt.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "advert-prod.hyrz.qq.com"
      policy: REJECT

  # ── 埋点 / 统计 / 崩溃上报（介意可整段注释掉）──
  - domain_suffix:
      match: "beacon.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "beaconcdn.qq.com"
      policy: REJECT
  - domain:
      match: "beacon.cdn.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "pingjs.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "sngmta.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "mtrace.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "trace.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "statistic.qzone.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "snowflake.qq.com"
      policy: REJECT
